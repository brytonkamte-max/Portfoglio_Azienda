<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagina prodotti</title>

<link rel="stylesheet" href="prodotti.css">
</head>
<body>

    <div class="contenitore">
    <!-- faccio l'header -->

            <header>
                <h1>MobilificioKekko</h1>

                <!--menu-->
                <nav id="menu" class="menu">
                    <a href="index.html">Home</a>
                    <a href="prodotti.html">Prodotti</a>
                    <a href="info.html">Informazioni</a>
                </nav>
            </header>

        
            <main>
        <h2>I Nostri Prodotti Disponibili</h2>
        
        <section id="lista" class="prodotti">
        
        <section class="prodotto-card">
            <img src="tavolo.jpg" alt="Tavolo" class="img-prodotto">
            <h3 id="nome-tavolo">Tavolo Kekko</h3>
            <p id="prezzo-tavolo" class="prezzo">25€</p>
            <button id="btn-tavolo">Acquista</button>
        </section>

        <section class="prodotto-card">
            <img src="sedia.jpg" alt="Sedia" class="img-prodotto">
            <h3 id="nome-sedia">Sedia Elegance</h3>
            <p id="prezzo-sedia" class="prezzo">45€</p>
            <button id="btn-sedia">Acquista</button>
        </section>

    </section>
    </main>

    <aside class="riepilogo">
    <h2>Prodotti Selezionati:</h2>
    <ul id="lista-scelta"></ul>
</aside>
    


</div>


<script src="prodotti.js"></script>
</body>
</html>
